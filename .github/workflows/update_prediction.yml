name: Update Pool Prediction

on:
  push:
    paths:
      - 'historique_piscine.csv'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn numpy

      - name: Run Prediction Script
        run: python update_site.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Pool Bot"
          git config --global user.email "action@github.com"
          git add index.html
          # Ne commit que si index.html a changé
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prediction website" && git push)
